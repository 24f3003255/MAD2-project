<!DOCTYPE html>
<html>
<head>
    <title>Manage Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
<div id="app">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">Trekking Management</span>
            <div>
                <button class="btn btn-light btn-sm me-2" @click="goToDashboard">Dashboard</button>
                <button class="btn btn-danger btn-sm" @click="logout">Logout</button>
            </div>
        </div>
    </nav>
    <div class="container py-4">
        <h3 class="mb-3">Manage Users</h3>
        <input
            type="text"
            class="form-control mb-3"
            placeholder="Search user..."
            v-model="searchQuery"
            @input="searchUsers"
        >
        <table class="table table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Bookings</th>
                    <th>Status</th>
                    <th>Created On</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="user in users" :key="user.id">
                    <td v-text="user.id"></td>
                    <td v-text="user.username"></td>
                    <td v-text="user.email"></td>
                    <td v-text="user.booking_count"></td>
                    <td>
                        <span class="badge bg-success" v-if="user.is_active">Active</span>
                        <span class="badge bg-danger" v-else>Inactive</span>
                    </td>
                    <td v-text="user.created_at"></td>
                    <td>
                        <button
                            class="btn btn-warning btn-sm"
                            v-if="user.is_active"
                            @click="deactivateUser(user.id)">
                            Deactivate
                        </button>
                    </td>
                </tr>
                <tr v-if="users.length==0">
                    <td colspan="7" class="text-center">No Users Available</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="/static/js/manage_users.js"></script>
</body>
</html>
