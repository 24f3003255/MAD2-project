<!DOCTYPE html>
<html>
<head>
    <title>My Bookings</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div id="app">
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">Trek Management</span>
        <div>
            <button class="btn btn-light btn-sm me-2" @click="goToDashboard">Dashboard</button>
            <button class="btn btn-primary btn-sm me-2" @click="goToAvailableTreks">Available Treks</button>
            <button class="btn btn-success btn-sm me-2" @click="exportCSV">Export History</button>
            <button class="btn btn-danger btn-sm" @click="logout">Logout</button>
        </div>
    </nav>

    <div class="container mt-4">
        <h3>My Bookings</h3>

        <table class="table table-bordered mt-3">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Trek</th>
                    <th>Location</th>
                    <th>Difficulty</th>
                    <th>Booked On</th>
                    <th>Booking</th>
                    <th>Payment</th>
                    <th>Trek</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                <tr v-for="booking in bookings" :key="booking.booking_id">
                    <td><span v-text="booking.booking_id"></span></td>
                    <td><span v-text="booking.trek_name"></span></td>
                    <td><span v-text="booking.location"></span></td>
                    <td><span v-text="booking.difficulty"></span></td>
                    <td><span v-text="booking.booking_date"></span></td>
                    <td><span v-text="booking.booking_status"></span></td>
                    <td><span v-text="booking.payment_status"></span></td>
                    <td><span v-text="booking.trek_status"></span></td>
                    <td>
                        <button
                            class="btn btn-danger btn-sm"
                            @click="cancelBooking(booking.booking_id)"
                            v-if="booking.booking_status == 'Booked'">
                            Cancel
                        </button>
                    </td>
                </tr>

                <tr v-if="bookings.length === 0">
                    <td colspan="9" class="text-center">No bookings found</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="/static/js/my_bookings.js"></script>
</body>
</html>
