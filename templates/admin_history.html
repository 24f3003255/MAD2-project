<!DOCTYPE html>
<html>
<head>
    <title>Booking History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
<div id="app">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">Trekking Management</span>
            <div>
                <button class="btn btn-light btn-sm me-2" @click="goDashboard">Dashboard</button>
                <button class="btn btn-danger btn-sm" @click="logout">Logout</button>
            </div>
        </div>
    </nav>
    <div class="container py-4">
        <h3 class="mb-3">Booking History</h3>
        <input
            type="text"
            class="form-control mb-3"
            placeholder="Search bookings..."
            v-model="searchQuery"
            @input="searchHistory"
        >
        <table class="table table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>User</th>
                    <th>Trek</th>
                    <th>Location</th>
                    <th>Date</th>
                    <th>Booking</th>
                    <th>Payment</th>
                    <th>Trek</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="booking in bookings" :key="booking.booking_id">
                    <td v-text="booking.booking_id"></td>
                    <td v-text="booking.username"></td>
                    <td v-text="booking.trek_name"></td>
                    <td v-text="booking.location"></td>
                    <td v-text="booking.booking_date"></td>
                    <td v-text="booking.booking_status"></td>
                    <td v-text="booking.payment_status"></td>
                    <td v-text="booking.trek_status"></td>
                </tr>
                <tr v-if="bookings.length==0">
                    <td colspan="8" class="text-center">
                        No Booking History Available
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="/static/js/admin_history.js"></script>
</body>
</html>
