<!DOCTYPE html>
<html>
<head>
    <title>Add Trek Staff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-light">
<div id="app" class="container mt-5">
    <div class="card col-md-6 mx-auto p-4">
        <h3 class="mb-4">Add Trek Staff</h3>
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" v-model="username">
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" v-model="email">
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" v-model="password">
        </div>
        <div class="mb-3">
            <label class="form-label">Contact Number</label>
            <input type="text" class="form-control" v-model="contact_number">
        </div>
        <div class="mt-3">
            <button class="btn btn-success me-2" @click="addStaff">
                Add Staff
            </button>
            <button class="btn btn-secondary" @click="goBack">
                Back
            </button>
        </div>
        <p class="text-success mt-3" v-if="successMessage">
            <span v-text="successMessage"></span>
        </p>
        <p class="text-danger mt-3" v-if="errorMessage">
            <span v-text="errorMessage"></span>
        </p>
    </div>
</div>
<script src="/static/js/add_staff.js"></script>
</body>
</html>
