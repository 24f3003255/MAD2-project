<!DOCTYPE html>
<html>
<head>
    <title>My Assigned Treks</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div id="app">
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">Trek Staff</span>
        <div>
            <button class="btn btn-secondary me-2" @click="goToDashboard">
                Dashboard
            </button>
            <button class="btn btn-danger" @click="logout">
                Logout
            </button>
        </div>
    </nav>
    <div class="container mt-4">
        <h2>My Assigned Treks</h2>
        <div class="card shadow mt-3">
            <div class="card-body">
                <table class="table table-bordered table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Trek Name</th>
                            <th>Location</th>
                            <th>Difficulty</th>
                            <th>Duration</th>
                            <th>Slots</th>
                            <th>Status</th>
                            <th>Participants</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="trek in treks" :key="trek.id">
                            <td v-text="trek.id"></td>
                            <td v-text="trek.trek_name"></td>
                            <td v-text="trek.location"></td>
                            <td v-text="trek.difficulty"></td>
                            <td v-text="trek.duration"></td>
                            <td v-text="trek.available_slots"></td>
                            <td v-text="trek.status"></td>
                            <td v-text="trek.participants"></td>
                            <td>
                                <button class="btn btn-warning btn-sm me-1" @click="openEditModal(trek)">
                                    Update
                                </button>
                                <button class="btn btn-info btn-sm me-1" @click="viewParticipants(trek.id)">
                                    View Participants
                                </button>
                                <button class="btn btn-success btn-sm" @click="completeTrek(trek.id)">
                                    Complete
                                </button>
                            </td>
                        </tr>
                        <tr v-if="treks.length === 0">
                            <td colspan="9" class="text-center">
                                No assigned treks available
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="modal fade" id="editTrekModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Update Trek</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label">
                        Available Slots
                    </label>
                    <input type="number" class="form-control mb-3" v-model="editTrek.available_slots">
                    <label class="form-label">
                        Trek Status
                    </label>
                    <select class="form-control" v-model="editTrek.status">
                        <option value="Open">Open</option>
                        <option value="Closed">Closed</option>
                        <option value="Started">Started</option>
                        <option value="Ongoing">Ongoing</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button class="btn btn-primary" @click="updateTrek">
                        Save
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/manage_assigned_treks.js"></script>
</body>
</html>
