<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-light">
<div id="app">
    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand">Trekking Management</span>
        <div class="ms-auto">
            <button class="btn btn-primary me-2" @click="goToAddStaff">Add Staff</button>
            <button class="btn btn-success me-2" @click="goToAddTrek">Add Trek</button>
            <button class="btn btn-info me-2" @click="goHistory">History</button>
            <button class="btn btn-danger" @click="logout">Logout</button>
            <button class="btn btn-primary me-2" @click="printReport">Generate Monthly Report</button>
            <button class="btn btn-info me-2" @click="viewReport">View Monthly Report</button>
        </div>
    </nav>
    <div class="container mt-4">
        <h2 class="mb-4">Admin Dashboard</h2>
        <div class="row">
            <div class="col-md-3 mb-3">
                <div class="card text-center p-3">
                    <h5>Total Users</h5>
                    <h2><span v-text="total_users"></span></h2>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center p-3">
                    <h5>Total Staff</h5>
                    <h2><span v-text="total_staff"></span></h2>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center p-3">
                    <h5>Total Treks</h5>
                    <h2><span v-text="total_treks"></span></h2>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center p-3">
                    <h5>Total Bookings</h5>
                    <h2><span v-text="total_bookings"></span></h2>
                </div>
            </div>
        </div>
        <div class="row mt-4">
            <div class="col-md-4 mb-3">
                <button class="btn btn-outline-primary w-100" @click="goToManageStaff">
                    Manage Staff
                </button>
            </div>
            <div class="col-md-4 mb-3">
                <button class="btn btn-outline-success w-100" @click="goToManageTreks">
                    Manage Treks
                </button>
            </div>
            <div class="col-md-4 mb-3">
                <button class="btn btn-outline-dark w-100" @click="goToManageUsers">
                    Manage Users
                </button>
            </div>
        </div>
    </div>
</div>
<script src="/static/js/admin.js"></script>
</body>
</html>
