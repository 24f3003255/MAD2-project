<!DOCTYPE html>
<html>
<head>
    <title>Staff Dashboard</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div id="app">
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">Trek Staff Dashboard</span>
        <div>
            <button class="btn btn-primary me-2" @click="goToAssignedTreks">
                My Treks
            </button>
            <button class="btn btn-danger" @click="logout">
                Logout
            </button>
        </div>
    </nav>
    <div class="container mt-4">
        <h2>Welcome, <span v-text="staff_name"></span></h2>
        <div class="row mt-4">
            <div class="col-md-6 mb-3">
                <div class="card shadow p-3 text-center">
                    <h5>Assigned Treks</h5>
                    <h2 v-text="assigned_treks"></h2>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="card shadow p-3 text-center">
                    <h5>Registered Trekkers</h5>
                    <h2 v-text="registered_trekkers"></h2>
                </div>
            </div>
        </div>
        <div class="text-center mt-4">
            <button class="btn btn-success" @click="goToAssignedTreks">
                Manage Assigned Treks
            </button>
        </div>
    </div>
</div>
<script src="/static/js/staff_dashboard.js"></script>
</body>
</html>
