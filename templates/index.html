<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trekking Management Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-light">
<div class="container mt-5" id="app">
    <h2 class="text-center mb-4">Trekking Management Application</h2>
    <div class="row">
        <div class="col-md-6 mb-3">
            <div class="card">
                <div class="card-body">
                    <h4 class="mb-3">Login</h4>
                    <input
                        type="email"
                        class="form-control mb-3"
                        placeholder="Email"
                        v-model="email"
                    >
                    <input
                        type="password"
                        class="form-control mb-3"
                        placeholder="Password"
                        v-model="password"
                    >
                    <button
                        class="btn btn-primary w-100"
                        @click="login">
                        Login
                    </button>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-3">
            <div class="card">
                <div class="card-body">
                    <h4 class="mb-3">Register</h4>
                    <input
                        type="text"
                        class="form-control mb-3"
                        placeholder="Username"
                        v-model="username"
                    >
                    <input
                        type="email"
                        class="form-control mb-3"
                        placeholder="Email"
                        v-model="regEmail"
                    >
                    <input
                        type="password"
                        class="form-control mb-3"
                        placeholder="Password"
                        v-model="regPassword"
                    >
                    <button
                        class="btn btn-success w-100"
                        @click="register">
                        Register
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="/static/js/login_register.js"></script>
</body>
</html>
