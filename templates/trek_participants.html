<!DOCTYPE html>
<html>
<head>
    <title>Trek Participants</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div id="app">
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">Trek Participants</span>
        <div>
            <button class="btn btn-secondary me-2" @click="goBack">
                Back
            </button>
            <button class="btn btn-danger" @click="logout">
                Logout
            </button>
        </div>
    </nav>
    <div class="container mt-4">
        <h3>
            Participants for 
            <span v-text="trek_name"></span>
        </h3>
        <div class="card shadow mt-3">
            <div class="card-body">
                <table class="table table-bordered table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Booking ID</th>
                            <th>User ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Booking Status</th>
                            <th>Payment Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="participant in participants" :key="participant.booking_id">
                            <td v-text="participant.booking_id"></td>
                            <td v-text="participant.user_id"></td>
                            <td v-text="participant.username"></td>
                            <td v-text="participant.email"></td>
                            <td v-text="participant.booking_status"></td>
                            <td v-text="participant.payment_status"></td>
                        </tr>
                        <tr v-if="participants.length === 0">
                            <td colspan="6" class="text-center">
                                No participants registered
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="/static/js/trek_participants.js"></script>
</body>
</html>
