<!DOCTYPE html>
<html>
<head>
    <title>Manage Staff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-light">
<div id="app">
    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand">Trekking Management</span>
        <div class="ms-auto">
            <button class="btn btn-secondary me-2" @click="goToDashboard">Dashboard</button>
            <button class="btn btn-primary me-2" @click="goToAddStaff">Add Staff</button>
            <button class="btn btn-danger" @click="logout">Logout</button>
        </div>
    </nav>
    <div class="container mt-4">
        <h2 class="mb-3">Manage Staff</h2>
        <div class="mb-3">
            <input
                type="text"
                class="form-control"
                placeholder="Search by ID, username or email"
                v-model="searchQuery"
                @input="searchStaff"
            >
        </div>
        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Contact</th>
                    <th>Status</th>
                    <th>Active</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="staff in staffs" :key="staff.id">
                    <td v-text="staff.id"></td>
                    <td v-text="staff.username"></td>
                    <td v-text="staff.email"></td>
                    <td v-text="staff.contact_number"></td>
                    <td v-text="staff.status"></td>
                    <td>
                        <span v-if="staff.is_active">Yes</span>
                        <span v-else>No</span>
                    </td>
                    <td>
                        <button
                            class="btn btn-warning btn-sm"
                            @click="deactivateStaff(staff.id)"
                            :disabled="!staff.is_active">
                            Deactivate
                        </button>
                    </td>
                </tr>
                <tr v-if="staffs.length===0">
                    <td colspan="7" class="text-center">
                        No staff found
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="/static/js/manage_staff.js"></script>
</body>
</html>
