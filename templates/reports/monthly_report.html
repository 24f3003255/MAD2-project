<!DOCTYPE html>
<html>
<head>
    <title>Monthly Trekking Report</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            margin:40px;
        }

        table{
            width:60%;
            border-collapse:collapse;
        }

        th,td{
            border:1px solid #000;
            padding:10px;
            text-align:left;
        }

        th{
            background:#f2f2f2;
        }

        h1{
            text-align:center;
        }
    </style>
</head>

<body>

<h1>Monthly Trekking Report</h1>

<p><strong>Generated On :</strong> {{ generated_date }}</p>

<table>

<tr>
    <th>Total Treks</th>
    <td>{{ total_treks }}</td>
</tr>

<tr>
    <th>Total Bookings</th>
    <td>{{ total_bookings }}</td>
</tr>

<tr>
    <th>Total Participants</th>
    <td>{{ total_participants }}</td>
</tr>

<tr>
    <th>Completed Treks</th>
    <td>{{ completed_treks }}</td>
</tr>

<tr>
    <th>Most Popular Trek</th>
    <td>{{ popular_trek }}</td>
</tr>

</table>

</body>
</html>
