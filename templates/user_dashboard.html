<!DOCTYPE html>
<html>
<head>
    <title>User Dashboard</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div id="app">
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">Trek Management</span>
        <div>
            <button class="btn btn-primary btn-sm me-2" @click="goToAvailableTreks">Available Treks</button>
            <button class="btn btn-success btn-sm me-2" @click="goToMyBookings">My Bookings</button>
            <button class="btn btn-info btn-sm me-2" @click="goProfile">Profile</button>
            <button class="btn btn-danger btn-sm" @click="logout">Logout</button>
        </div>
    </nav>

    <div class="container mt-4">
        <h3>User Dashboard</h3>

        <p class="mt-3">
            Welcome,
            <strong><span v-text="username"></span></strong>
        </p>

        <div class="border rounded p-3" style="max-width: 250px;">
            <h5>Total Bookings</h5>
            <h2><span v-text="total_bookings"></span></h2>
        </div>
    </div>
</div>

<script src="/static/js/user_dashboard.js"></script>
</body>
</html>
