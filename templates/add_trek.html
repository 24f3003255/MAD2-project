<!DOCTYPE html>
<html>
<head>
    <title>Add Trek</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-light">
<div id="app">
    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand">Trekking Management</span>
        <div class="ms-auto">
            <button class="btn btn-secondary me-2" @click="goToDashboard">Dashboard</button>
            <button class="btn btn-danger" @click="logout">Logout</button>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="card p-4">
            <h2 class="mb-4">Add Trek</h2>
            <div class="mb-3">
                <label class="form-label">Trek Name</label>
                <input type="text" class="form-control" v-model="trek_name">
            </div>
            <div class="mb-3">
                <label class="form-label">Location</label>
                <input type="text" class="form-control" v-model="location">
            </div>
            <div class="mb-3">
                <label class="form-label">Difficulty</label>
                <select class="form-select" v-model="difficulty">
                    <option value="">Select</option>
                    <option value="Easy">Easy</option>
                    <option value="Moderate">Moderate</option>
                    <option value="Hard">Hard</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Duration (Days)</label>
                <input type="number" class="form-control" v-model="duration">
            </div>
            <div class="mb-3">
                <label class="form-label">Available Slots</label>
                <input type="number" class="form-control" v-model="available_slots">
            </div>
            <div class="mb-3">
                <label class="form-label">Assign Staff</label>
                <select class="form-select" v-model="assigned_staff_id">
                    <option value="">Select Staff</option>
                    <option
                        v-for="staff in staffOptions"
                        :key="staff.staff_profile_id"
                        :value="staff.staff_profile_id"
                        v-text="staff.username">
                    </option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Status</label>
                <select class="form-select" v-model="status">
                    <option value="Pending">Pending</option>
                    <option value="Open">Open</option>
                    <option value="Closed">Closed</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Start Date</label>
                    <input type="date" class="form-control" v-model="start_date">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">End Date</label>
                    <input type="date" class="form-control" v-model="end_date">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea rows="4" class="form-control" v-model="description"></textarea>
            </div>
            <button class="btn btn-primary" @click="addTrek">
                Add Trek
            </button>
        </div>
    </div>
</div>
<script src="/static/js/add_trek.js"></script>
</body>
</html>
